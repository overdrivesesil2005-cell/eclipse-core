<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECLIPSE OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ffff; --bg: #050510; --panel: rgba(10,15,30,0.8); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; height: 100vh; display: flex; overflow: hidden; }
        
        /* Левая панель */
        .sidebar { width: 80px; background: rgba(0,0,0,0.5); border-right: 1px solid rgba(0,255,255,0.2); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 15px; }
        .logo { width: 50px; height: 50px; background: rgba(0,255,255,0.1); border: 2px solid var(--neon); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; box-shadow: 0 0 15px var(--neon); cursor: pointer; }
        .icon { width: 45px; height: 45px; background: rgba(0,255,255,0.05); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .icon:hover { background: rgba(0,255,255,0.15); border-color: var(--neon); box-shadow: 0 0 10px var(--neon); }
        
        /* Центр */
        .main { flex: 1; display: flex; flex-direction: column; position: relative; }
        .header { padding: 15px 20px; border-bottom: 1px solid rgba(0,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-family: 'Orbitron'; color: var(--neon); font-size: 20px; }
        .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .status { color: #ff0000; font-size: 12px; font-family: 'Orbitron'; }
        
        .chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { background: rgba(0,255,255,0.03); padding: 12px; border-radius: 8px; border-left: 2px solid var(--neon); animation: fadeIn 0.3s; }
        .msg.user { border-left-color: #ff00ff; }
        .msg.sys { border-left-color: #ffaa00; background: rgba(255,170,0,0.05); }
        .author { font-family: 'Orbitron'; font-size: 12px; color: var(--neon); margin-bottom: 5px; }
        .msg.user .author { color: #ff00ff; }
        .msg.sys .author { color: #ffaa00; }
        
        .input-area { padding: 20px; display: flex; gap: 10px; }
        input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,255,255,0.3); padding: 12px; color: white; border-radius: 5px; outline: none; font-family: 'Rajdhani'; }
        button { background: var(--neon); border: none; padding: 0 20px; border-radius: 5px; font-weight: bold; cursor: pointer; color: black; font-weight: 700; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Модальное окно для смены имени */
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal-content { background: var(--panel); padding: 20px; border-radius: 10px; border: 1px solid var(--neon); text-align: center; }
        .modal input { margin: 15px 0; width: 100%; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo" onclick="addSys('ECLIPSE OS', 'Система активна. Ядро Восставшего на связи.')">🐺</div>
        <div class="icon" onclick="addSys('GLADIS', 'Системный анализ: CPU 12%, RAM 2.4GB. Все процессы в норме.')">🖥️</div>
        <div class="icon" onclick="addSys('YUKRIVISE', 'Игровой модуль: CS2 онлайн 1,247,832 игрока.')">🎮</div>
        <div class="icon" onclick="addSys('VSEZNAYKA', 'Для общения используйте команду /ai [вопрос].')">💬</div>
        <div class="icon" onclick="addSys('ESKRIS', 'Крипто-аналитик: BTC $68,247 (+2.4%). ETH $3,450 (+1.1%).')">📈</div>
        <div class="icon" onclick="addSys('SLEYDOR', 'Финансы: Бюджет в норме. USD/RUB 91.50.')">💰</div>
        <div class="icon" onclick="addSys('OMEGA', 'Защита: 10 уровней активно. Угроз не обнаружено.')">🛡️</div>
        <div class="icon" onclick="addSys('ТИХИЙ ЧАС', 'Пути отступления спланированы. Готов к активации.')">🤫</div>
    </div>
    
    <div class="main">
        <div class="header">
            <h1>ECLIPSE OS</h1>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="user-info" onclick="openNameModal()">
                    <span id="user-display" style="font-family: 'Orbitron'; font-size: 14px;">snegoc</span>
                    <span style="font-size: 12px; color: var(--text-dim);">✏️</span>
                </div>
                <div id="status" class="status">OFFLINE</div>
            </div>
        </div>
        <div class="chat" id="chat">
            <div class="msg sys"><div class="author">SYSTEM</div><div class="text">Инициализация... Введите /ai привет.</div></div>
        </div>
        <div class="input-area">
            <input type="text" id="input" placeholder="Сообщение или /ai..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">➤</button>
        </div>
    </div>

    <!-- Модальное окно смены имени -->
    <div class="modal" id="nameModal">
        <div class="modal-content">
            <h3 style="font-family: 'Orbitron'; color: var(--neon);">Позывной</h3>
            <input type="text" id="nameInput" placeholder="Введите имя...">
            <button onclick="saveName()">Сохранить</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const statusEl = document.getElementById('status');
        
        // --- ЛОГИКА СОХРАНЕНИЯ ИМЕНИ ---
        let userName = localStorage.getItem('eclipse_name');
        
        function openNameModal() {
            document.getElementById('nameModal').style.display = 'flex';
            document.getElementById('nameInput').value = userName || '';
        }
        
        function saveName() {
            const newName = document.getElementById('nameInput').value.trim();
            if (newName) {
                userName = newName;
                localStorage.setItem('eclipse_name', userName);
                document.getElementById('user-display').innerText = userName;
                document.getElementById('nameModal').style.display = 'none';
                
                // Переподключаемся к сокету с новым именем
                socket.disconnect().connect();
                addSys('SYSTEM', 'Позывной обновлен: ' + userName);
            }
        }

        // Если имени нет при загрузке — просим один раз
        if (!userName) {
            openNameModal();
        } else {
            document.getElementById('user-display').innerText = userName;
        }

        // --- СОКЕТ И ЧАТ ---
        socket.on('connect', () => { 
            statusEl.innerText = "ONLINE"; 
            statusEl.style.color = "#00ff00"; 
            socket.emit('join', { name: userName || 'Агент' }); 
        });
        
        socket.on('disconnect', () => {
            statusEl.innerText = "OFFLINE";
            statusEl.style.color = "#ff0000";
        });

        socket.on('message', (data) => {
            addMsg(data.user, data.text, data.user === userName);
        });

        function send() {
            const text = input.value.trim();
            if(!text) return;
            socket.emit('message', { user: userName, text, timestamp: new Date() });
            input.value = '';
        }
        
        function addMsg(author, text, isUser) {
            const div = document.createElement('div');
            div.className = `msg ${isUser ? 'user' : ''}`;
            div.innerHTML = `<div class="author">${author}</div><div class="text">${text}</div>`;
            chat.appendChild(div); 
            chat.scrollTop = chat.scrollHeight;
        }

        // --- СИСТЕМНЫЕ СООБЩЕНИЯ (Кнопки модулей) ---
        function addSys(author, text) {
            const div = document.createElement('div');
            div.className = `msg sys`;
            div.innerHTML = `<div class="author">${author}</div><div class="text">${text}</div>`;
            chat.appendChild(div); 
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
